<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon -->
  <g transform="translate(10, 10)">
    <!-- Blue gradient background -->
    <defs>
      <linearGradient id="diamtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2563eb"/>
        <stop offset="100%" stop-color="#1d4ed8"/>
      </linearGradient>
    </defs>
    <rect width="80" height="80" fill="url(#diamtGrad)" rx="18"/>
    
    <!-- Power / Device streaming symbol -->
    <circle cx="40" cy="40" r="22" fill="none" stroke="white" stroke-width="4" stroke-dasharray="100 25"/>
    <line x1="40" y1="24" x2="40" y2="44" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="105" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#3b82f6" letter-spacing="-1">
    DIAMT
  </text>
  <text x="245" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="400" fill="#94a3b8" letter-spacing="-1">
    CLOUD
  </text>
</svg>
