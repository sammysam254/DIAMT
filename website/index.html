  <body>
    <div id="root">
      <div style="min-height: 100vh; background: #050811; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; border-top-color: #38bdf8; border-right-color: #2563eb; animation: diamtPreSpin 1.4s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;"></div>
          <div style="position: absolute; inset: 9px; border-radius: 50%; border: 1.5px dashed rgba(56, 189, 248, 0.35); border-bottom-color: #8b5cf6; animation: diamtPreRev 2.2s linear infinite;"></div>
          <div style="width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #1d4ed8, #0284c7); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(56, 189, 248, 0.5);">
            <svg viewBox="0 0 24 24" fill="none" style="width: 22px; height: 22px; color: #fff;">
              <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div style="font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #fff; margin-bottom: 6px;">
          DIAMT <span style="color: #38bdf8;">CLOUD</span>
        </div>
        <div style="font-size: 12px; color: #94a3b8; letter-spacing: 0.5px;">
          INITIALIZING SECURE PLATFORM...
        </div>
      </div>
      <style>
        @keyframes diamtPreSpin { 100% { transform: rotate(360deg); } }
        @keyframes diamtPreRev { 100% { transform: rotate(-360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
